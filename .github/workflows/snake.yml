name: animação de contribuições

# Gera a cobrinha que come o gráfico de contribuições e publica na branch `output`.
# Roda dentro do Actions deste repo — não depende de nenhum serviço de terceiro em runtime,
# que foi exatamente o que matou os widgets antigos (streak-stats e activity-graph).

on:
  schedule:
    # todo dia às 03:00 UTC (00:00 em Curitiba)
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Gerar SVG da cobrinha
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # cores da marca: vermelhão E8431F na cobra, trilha em tons de cinza
          outputs: |
            dist/snake.svg?color_snake=E8431F&color_dots=#EDE9E1,#DDD8CF,#B9B2A6,#8A8375,#0F1417
            dist/snake-dark.svg?palette=github-dark&color_snake=E8431F

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
